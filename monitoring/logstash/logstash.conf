input {
  beats {
    port => 5044
  }
  
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Process KiTS Hub application logs
  if [fields][service] == "kits-hub" {
    json {
      source => "message"
    }
    
    # Add tenant-based index routing
    if [tenant_id] {
      mutate {
        add_field => { "index_prefix" => "tenant_%{[tenant_id]}" }
      }
    } else {
      mutate {
        add_field => { "index_prefix" => "kits-hub-system" }
      }
    }
    
    # Parse timestamp if present
    if [timestamp] {
      date {
        match => [ "timestamp", "ISO8601" ]
      }
    }
    
    # Add solution and environment tags
    if [solution] {
      mutate {
        add_tag => [ "%{solution}" ]
      }
    }
    
    # Parse request/response logs
    if [request_id] {
      mutate {
        add_tag => [ "request" ]
      }
    }
    
    # Parse security events
    if [event_type] == "security" {
      mutate {
        add_tag => [ "security" ]
      }
    }
    
    # Parse performance events
    if [event_type] == "performance" {
      mutate {
        add_tag => [ "performance" ]
      }
    }
    
    # Parse business events
    if [event_type] == "business" {
      mutate {
        add_tag => [ "business" ]
      }
    }
    
    # Parse audit events
    if [event_type] == "audit" {
      mutate {
        add_tag => [ "audit" ]
      }
    }
  }
  
  # Process infrastructure logs
  if [fields][service] == "infrastructure" {
    # Add infrastructure-specific processing
    mutate {
      add_tag => [ "infrastructure" ]
    }
  }
  
  # Process error logs
  if [level] == "error" or [severity] == "error" {
    mutate {
      add_tag => [ "error" ]
    }
  }
  
  # Add geo IP data if available
  if [ip] {
    geoip {
      source => "ip"
      target => "geoip"
    }
  }
  
  # Clean up fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "input", "log" ]
  }
}

output {
  # Output to Elasticsearch with tenant-based indices
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[index_prefix]}-%{+YYYY.MM.dd}"
    
    # Template for index patterns
    template_name => "kits-hub"
    template_pattern => "kits-hub-*"
    template => {
      "index_patterns" => ["kits-hub-*", "tenant_*"],
      "settings" => {
        "number_of_shards" => 1,
        "number_of_replicas" => 1,
        "index.refresh_interval" => "5s"
      },
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" },
          "level" => { "type" => "keyword" },
          "message" => { "type" => "text" },
          "service" => { "type" => "keyword" },
          "solution" => { "type" => "keyword" },
          "tenant_id" => { "type" => "keyword" },
          "user_id" => { "type" => "keyword" },
          "request_id" => { "type" => "keyword" },
          "event_type" => { "type" => "keyword" },
          "duration_ms" => { "type" => "long" },
          "status_code" => { "type" => "integer" },
          "method" => { "type" => "keyword" },
          "endpoint" => { "type" => "keyword" },
          "ip" => { "type" => "ip" },
          "user_agent" => { "type" => "text" },
          "error" => { "type" => "text" },
          "severity" => { "type" => "keyword" }
        }
      }
    }
  }
  
  # Debug output (remove in production)
  if [@metadata][debug] {
    stdout {
      codec => rubydebug
    }
  }
}
