global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  # KiTS Hub Shell Application
  - job_name: 'kits-hub-shell'
    static_configs:
      - targets: ['shell:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # KiTS Hub Inventory Service
  - job_name: 'kits-hub-inventory'
    static_configs:
      - targets: ['inventory:4177']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # KiTS Hub POS Service
  - job_name: 'kits-hub-pos'
    static_configs:
      - targets: ['pos:4178']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # KiTS Hub CRM Service
  - job_name: 'kits-hub-crm'
    static_configs:
      - targets: ['crm:4179']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # KiTS Hub HR Service
  - job_name: 'kits-hub-hr'
    static_configs:
      - targets: ['hr:4180']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # KiTS Hub Accounting Service
  - job_name: 'kits-hub-accounting'
    static_configs:
      - targets: ['accounting:4181']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # KiTS Hub Analytics Service
  - job_name: 'kits-hub-analytics'
    static_configs:
      - targets: ['analytics:4182']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Nginx Exporter for web server metrics
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']

  # Database Exporter
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']

  # Kubernetes API Server
  - job_name: 'kubernetes-apiservers'
    kubernetes_sd_configs:
      - role: endpoints
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
        action: keep
        regex: default;kubernetes;https

  # Kubernetes Nodes
  - job_name: 'kubernetes-nodes'
    kubernetes_sd_configs:
      - role: node
    scheme: https
    tls_config:
      ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)

  # Kubernetes Pods
  - job_name: 'kubernetes-pods'
    kubernetes_sd_configs:
      - role: pod
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
