<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Overflow Explosion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            position: relative;
            width: 600px;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .number-display {
            font-size: 4rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            z-index: 10;
            position: relative;
            transition: all 0.3s ease;
        }

        .zero {
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .container-border {
            position: absolute;
            width: 500px;
            height: 300px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .container-border.warning {
            border-color: rgba(255, 200, 0, 0.8);
            background: rgba(255, 200, 0, 0.2);
            animation: shake 0.5s infinite;
        }

        .container-border.danger {
            border-color: rgba(255, 0, 0, 0.8);
            background: rgba(255, 0, 0, 0.2);
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .particle {
            position: absolute;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            pointer-events: none;
            z-index: 100;
        }

        @keyframes explode-particle {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(180deg);
                opacity: 0.8;
            }
            100% {
                transform: translate(calc(var(--tx) * 2), calc(var(--ty) * 2)) scale(0.5) rotate(360deg);
                opacity: 0;
            }
        }

        .explosion-flash {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0) 70%);
            pointer-events: none;
            z-index: 200;
            opacity: 0;
        }

        @keyframes flash {
            0% { opacity: 0; }
            10% { opacity: 1; }
            100% { opacity: 0; }
        }

        .controls {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 20px;
            z-index: 50;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255, 255, 255, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .status {
            position: absolute;
            top: 30px;
            color: white;
            font-size: 1.2rem;
            text-align: center;
            z-index: 50;
        }

        .overflow-indicator {
            position: absolute;
            top: -30px;
            right: -30px;
            font-size: 2rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overflow-indicator.visible {
            opacity: 1;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <div class="status" id="status">Starting zero counter...</div>
    
    <div class="container">
        <div class="container-border" id="container">
            <div class="overflow-indicator" id="overflowIndicator">⚠️</div>
            <div class="number-display" id="numberDisplay">0</div>
        </div>
    </div>

    <div class="explosion-flash" id="explosionFlash"></div>

    <div class="controls">
        <button onclick="startAnimation()">Start Animation</button>
        <button onclick="resetAnimation()">Reset</button>
        <button onclick="toggleSpeed()">Speed: <span id="speedText">Normal</span></button>
    </div>

    <script>
        let currentZeros = 0;
        let animationId = null;
        let isAnimating = false;
        let speed = 1; // 1 = normal, 2 = fast, 0.5 = slow
        let explosionOccurred = false;

        const numberDisplay = document.getElementById('numberDisplay');
        const container = document.getElementById('container');
        const status = document.getElementById('status');
        const explosionFlash = document.getElementById('explosionFlash');
        const overflowIndicator = document.getElementById('overflowIndicator');
        const speedText = document.getElementById('speedText');

        function updateDisplay() {
            if (currentZeros === 0) {
                numberDisplay.textContent = '0';
            } else {
                const zeros = '0'.repeat(currentZeros);
                // Group zeros for better readability
                const grouped = zeros.match(/.{1,20}/g)?.join(' ') || zeros;
                numberDisplay.innerHTML = `<span class="zero">${grouped}</span>`;
            }
        }

        function createExplosionParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.textContent = '0';
            
            // Random explosion direction and distance
            const angle = Math.random() * Math.PI * 2;
            const distance = 200 + Math.random() * 400;
            const tx = Math.cos(angle) * distance;
            const ty = Math.sin(angle) * distance;
            
            particle.style.setProperty('--tx', `${tx}px`);
            particle.style.setProperty('--ty', `${ty}px`);
            particle.style.left = `${x}px`;
            particle.style.top = `${y}px`;
            particle.style.animation = `explode-particle ${2 + Math.random() * 2}s ease-out forwards`;
            
            document.body.appendChild(particle);
            
            // Remove particle after animation
            setTimeout(() => {
                particle.remove();
            }, 4000);
        }

        function createExplosion() {
            if (explosionOccurred) return;
            explosionOccurred = true;
            
            status.textContent = '💥 BOOM! System overflow!';
            
            // Flash effect
            explosionFlash.style.animation = 'flash 0.5s ease-out forwards';
            
            // Get container position for explosion center
            const rect = container.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            // Create explosion particles
            const particleCount = 50;
            for (let i = 0; i < particleCount; i++) {
                setTimeout(() => {
                    createExplosionParticle(centerX, centerY);
                }, i * 20);
            }
            
            // Hide the number display
            numberDisplay.style.opacity = '0';
            container.style.transform = 'scale(1.2)';
            container.style.opacity = '0';
            
            // Reset after explosion
            setTimeout(() => {
                resetAnimation();
            }, 5000);
        }

        function animate() {
            if (!isAnimating) return;
            
            currentZeros += Math.ceil(speed);
            updateDisplay();
            
            // Update status
            status.textContent = `Zero count: ${currentZeros}`;
            
            // Warning states with new thresholds
            if (currentZeros >= 4 && currentZeros < 6) {
                container.classList.add('warning');
                container.classList.remove('danger');
                overflowIndicator.classList.add('visible');
                overflowIndicator.textContent = '⚠️';
                // Slow vibration
                container.style.animation = 'shake 1s infinite';
            } else if (currentZeros >= 6 && currentZeros < 8) {
                container.classList.add('danger');
                container.classList.remove('warning');
                overflowIndicator.classList.add('visible');
                overflowIndicator.textContent = '🚨';
                // Heavy vibration
                container.style.animation = 'shake 0.3s infinite';
            } else if (currentZeros >= 8) {
                createExplosion();
                return;
            } else {
                // Reset animations for normal state
                container.classList.remove('warning', 'danger');
                overflowIndicator.classList.remove('visible');
                container.style.animation = '';
            }
            
            // Continue animation
            animationId = requestAnimationFrame(() => {
                setTimeout(animate, 800 / speed); // Slower counting to see the buildup
            });
        }

        function startAnimation() {
            if (isAnimating) return;
            
            isAnimating = true;
            explosionOccurred = false;
            status.textContent = 'Animation started...';
            animate();
        }

        function resetAnimation() {
            isAnimating = false;
            currentZeros = 0;
            explosionOccurred = false;
            
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            // Reset UI
            updateDisplay();
            numberDisplay.style.opacity = '1';
            container.style.transform = 'scale(1)';
            container.style.opacity = '1';
            container.classList.remove('warning', 'danger');
            overflowIndicator.classList.remove('visible');
            explosionFlash.style.animation = '';
            status.textContent = 'Reset complete. Ready to start!';
            
            // Clear any remaining particles
            document.querySelectorAll('.particle').forEach(p => p.remove());
        }

        function toggleSpeed() {
            if (speed === 1) {
                speed = 2;
                speedText.textContent = 'Fast';
            } else if (speed === 2) {
                speed = 0.5;
                speedText.textContent = 'Slow';
            } else {
                speed = 1;
                speedText.textContent = 'Normal';
            }
        }

        // Initialize
        updateDisplay();
        status.textContent = 'Press "Start Animation" to begin the zero overflow!';
    </script>
</body>
</html>
