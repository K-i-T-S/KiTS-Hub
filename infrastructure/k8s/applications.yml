apiVersion: v1
kind: Namespace
metadata:
  name: kits-hub
  labels:
    name: kits-hub
    environment: production

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kits-hub-config
  namespace: kits-hub
data:
  NODE_ENV: "production"
  REDIS_URL: "redis://redis-service:6379"
  OTLP_EXPORTER_OTLP_ENDPOINT: "http://jaeger-service:14268/api/traces"

---
apiVersion: v1
kind: Secret
metadata:
  name: kits-hub-secrets
  namespace: kits-hub
type: Opaque
data:
  # Base64 encoded values - replace with actual encoded secrets
  POSTGRES_PASSWORD: <base64-encoded-password>
  NEXTAUTH_SECRET: <base64-encoded-secret>
  DATABASE_URL: <base64-encoded-database-url>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-management
  namespace: kits-hub
  labels:
    app: inventory-management
    solution: inventory
spec:
  replicas: 3
  selector:
    matchLabels:
      app: inventory-management
  template:
    metadata:
      labels:
        app: inventory-management
        solution: inventory
    spec:
      containers:
      - name: inventory-management
        image: ghcr.io/your-username/kits-hub-inventory-management:latest
        ports:
        - containerPort: 3001
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: kits-hub-config
              key: NODE_ENV
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: kits-hub-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: kits-hub-config
              key: REDIS_URL
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: kits-hub-secrets
              key: NEXTAUTH_SECRET
        - name: NEXTAUTH_URL
          value: "https://inventory.kits-hub.com"
        - name: OTLP_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: kits-hub-config
              key: OTLP_EXPORTER_OTLP_ENDPOINT
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: inventory-management-service
  namespace: kits-hub
  labels:
    app: inventory-management
spec:
  selector:
    app: inventory-management
  ports:
  - name: http
    port: 80
    targetPort: 3001
    protocol: TCP
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: point-of-sale
  namespace: kits-hub
  labels:
    app: point-of-sale
    solution: pos
spec:
  replicas: 3
  selector:
    matchLabels:
      app: point-of-sale
  template:
    metadata:
      labels:
        app: point-of-sale
        solution: pos
    spec:
      containers:
      - name: point-of-sale
        image: ghcr.io/your-username/kits-hub-point-of-sale:latest
        ports:
        - containerPort: 3002
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: kits-hub-config
              key: NODE_ENV
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: kits-hub-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: kits-hub-config
              key: REDIS_URL
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: kits-hub-secrets
              key: NEXTAUTH_SECRET
        - name: NEXTAUTH_URL
          value: "https://pos.kits-hub.com"
        - name: OTLP_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: kits-hub-config
              key: OTLP_EXPORTER_OTLP_ENDPOINT
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3002
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3002
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: point-of-sale-service
  namespace: kits-hub
  labels:
    app: point-of-sale
spec:
  selector:
    app: point-of-sale
  ports:
  - name: http
    port: 80
    targetPort: 3002
    protocol: TCP
  type: ClusterIP
