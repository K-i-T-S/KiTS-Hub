apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-system
  namespace: kits-hub
  labels:
    app: crm-system
    solution: crm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: crm-system
  template:
    metadata:
      labels:
        app: crm-system
        solution: crm
    spec:
      containers:
      - name: crm-system
        image: ghcr.io/your-username/kits-hub-crm-system:latest
        ports:
        - containerPort: 3003
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: kits-hub-config
              key: NODE_ENV
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: kits-hub-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: kits-hub-config
              key: REDIS_URL
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: kits-hub-secrets
              key: NEXTAUTH_SECRET
        - name: NEXTAUTH_URL
          value: "https://crm.kits-hub.com"
        - name: OTLP_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: kits-hub-config
              key: OTLP_EXPORTER_OTLP_ENDPOINT
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: crm-system-service
  namespace: kits-hub
  labels:
    app: crm-system
spec:
  selector:
    app: crm-system
  ports:
  - name: http
    port: 80
    targetPort: 3003
    protocol: TCP
  type: ClusterIP

