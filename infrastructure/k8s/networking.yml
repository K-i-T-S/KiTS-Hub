apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kits-hub-ingress
  namespace: kits-hub
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - inventory.kits-hub.com
    - pos.kits-hub.com
    - crm.kits-hub.com
    - hr.kits-hub.com
    - accounting.kits-hub.com
    - analytics.kits-hub.com
    secretName: kits-hub-tls
  rules:
  - host: inventory.kits-hub.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: inventory-management-service
            port:
              number: 80
  - host: pos.kits-hub.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: point-of-sale-service
            port:
              number: 80
  - host: crm.kits-hub.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: crm-system-service
            port:
              number: 80
  - host: hr.kits-hub.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: hr-management-service
            port:
              number: 80
  - host: accounting.kits-hub.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: accounting-system-service
            port:
              number: 80
  - host: analytics.kits-hub.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: analytics-dashboard-service
            port:
              number: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: inventory-management-hpa
  namespace: kits-hub
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inventory-management
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

