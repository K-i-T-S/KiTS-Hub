events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format detailed '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for" '
                       'tenant_id="$http_x_tenant_id" '
                       'user_id="$http_x_user_id" '
                       'request_id="$http_x_request_id" '
                       'rt=$request_time uct="$upstream_connect_time" '
                       'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log detailed;
    error_log /var/log/nginx/error.log warn;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75;
    keepalive_requests 100;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=5r/s;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Upstream servers
    upstream inventory_backend {
        least_conn;
        server inventory-management:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream pos_backend {
        least_conn;
        server point-of-sale:3002 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream crm_backend {
        least_conn;
        server crm-system:3003 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream hr_backend {
        least_conn;
        server hr-management:3004 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream accounting_backend {
        least_conn;
        server accounting-system:3005 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream analytics_backend {
        least_conn;
        server analytics-dashboard:3006 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none';" always;

    # Main server block for inventory management
    server {
        listen 80;
        listen [::]:80;
        server_name inventory.kits-hub.com;
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name inventory.kits-hub.com;

        ssl_certificate /etc/nginx/ssl/inventory.kits-hub.com.crt;
        ssl_certificate_key /etc/nginx/ssl/inventory.kits-hub.com.key;

        # Client max body size for file uploads
        client_max_body_size 50M;

        # Rate limiting
        limit_conn conn_limit_per_ip 20;
        limit_req_status 429;

        # Cache settings
        proxy_cache_path /var/cache/nginx/inventory levels=1:2 keys_zone=inventory_cache:10m inactive=60m use_temp_path=off;

        # Static file caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary Accept-Encoding;
            try_files $uri @inventory_backend;
        }

        # API endpoints with rate limiting
        location /api/ {
            limit_req zone=api burst=200 nodelay;
            proxy_cache_bypass $http_pragma $http_authorization;
            proxy_no_cache $http_pragma $http_authorization;
            
            proxy_pass http://inventory_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-User-ID $http_x_user_id;
            proxy_set_header X-Request-ID $http_x_request_id;
            
            proxy_cache inventory_cache;
            proxy_cache_valid 200 302 10m;
            proxy_cache_valid 404 1m;
            proxy_cache_key "$scheme$request_method$host$request_uri$http_x_tenant_id";
            proxy_cache_methods GET HEAD;
            
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Login endpoints with stricter rate limiting
        location /api/auth/login {
            limit_req zone=login burst=20 nodelay;
            
            proxy_pass http://inventory_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # File upload endpoints
        location /api/upload {
            limit_req zone=upload burst=10 nodelay;
            client_max_body_size 100M;
            
            proxy_pass http://inventory_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-User-ID $http_x_user_id;
            
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Default location
        location @inventory_backend {
            proxy_pass http://inventory_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-User-ID $http_x_user_id;
            proxy_set_header X-Request-ID $http_x_request_id;
            
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # Similar server blocks for other services...
    # POS service
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name pos.kits-hub.com;

        ssl_certificate /etc/nginx/ssl/pos.kits-hub.com.crt;
        ssl_certificate_key /etc/nginx/ssl/pos.kits-hub.com.key;

        client_max_body_size 50M;
        limit_conn conn_limit_per_ip 20;

        location / {
            proxy_pass http://pos_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-User-ID $http_x_user_id;
        }
    }

    # CRM service
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name crm.kits-hub.com;

        ssl_certificate /etc/nginx/ssl/crm.kits-hub.com.crt;
        ssl_certificate_key /etc/nginx/ssl/crm.kits-hub.com.key;

        location / {
            proxy_pass http://crm_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-User-ID $http_x_user_id;
        }
    }

    # HR service
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name hr.kits-hub.com;

        ssl_certificate /etc/nginx/ssl/hr.kits-hub.com.crt;
        ssl_certificate_key /etc/nginx/ssl/hr.kits-hub.com.key;

        location / {
            proxy_pass http://hr_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-User-ID $http_x_user_id;
        }
    }

    # Accounting service
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name accounting.kits-hub.com;

        ssl_certificate /etc/nginx/ssl/accounting.kits-hub.com.crt;
        ssl_certificate_key /etc/nginx/ssl/accounting.kits-hub.com.key;

        location / {
            proxy_pass http://accounting_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-User-ID $http_x_user_id;
        }
    }

    # Analytics service
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name analytics.kits-hub.com;

        ssl_certificate /etc/nginx/ssl/analytics.kits-hub.com.crt;
        ssl_certificate_key /etc/nginx/ssl/analytics.kits-hub.com.key;

        location / {
            proxy_pass http://analytics_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Tenant-ID $http_x_tenant_id;
            proxy_set_header X-User-ID $http_x_user_id;
        }
    }
}
