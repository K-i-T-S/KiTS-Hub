apiVersion: apps/v1
kind: Deployment
metadata:
  name: kits-hub-inventory
  namespace: kits-hub
  labels:
    app: kits-hub-inventory
    component: inventory
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kits-hub-inventory
  template:
    metadata:
      labels:
        app: kits-hub-inventory
        component: inventory
        version: v1
    spec:
      containers:
      - name: inventory
        image: kits-hub/inventory:latest
        ports:
        - containerPort: 4177
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: kits-hub-config
              key: NODE_ENV
        - name: API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: kits-hub-config
              key: API_BASE_URL
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: kits-hub-secrets
              key: SUPABASE_URL
        - name: SUPABASE_ANON_KEY
          valueFrom:
            secretKeyRef:
              name: kits-hub-secrets
              key: SUPABASE_ANON_KEY
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4177
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 4177
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kits-hub-inventory-service
  namespace: kits-hub
  labels:
    app: kits-hub-inventory
    component: inventory
spec:
  type: ClusterIP
  ports:
  - port: 4177
    targetPort: 4177
    protocol: TCP
    name: http
  selector:
    app: kits-hub-inventory
---
