apiVersion: v1
kind: Secret
metadata:
  name: kits-hub-secrets
  namespace: kits-hub
type: Opaque
data:
  # Base64 encoded values
  SUPABASE_URL: <BASE64_ENCODED_SUPABASE_URL>
  SUPABASE_ANON_KEY: <BASE64_ENCODED_SUPABASE_ANON_KEY>
  SUPABASE_SERVICE_KEY: <BASE64_ENCODED_SUPABASE_SERVICE_KEY>
  DATABASE_URL: <BASE64_ENCODED_DATABASE_URL>
  REDIS_URL: <BASE64_ENCODED_REDIS_URL>
  JWT_SECRET: <BASE64_ENCODED_JWT_SECRET>
  API_KEYS: <BASE64_ENCODED_API_KEYS>
  WEBHOOK_SECRET: <BASE64_ENCODED_WEBHOOK_SECRET>
